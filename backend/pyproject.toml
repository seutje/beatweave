[project]
name = "beatweave-backend"
version = "0.3.8"
description = "Local Beatweave application backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "beat-this>=1.1,<2",
  "fastapi>=0.115,<1",
  "gradio-client>=1.10,<2",
  "numpy>=2,<3",
  "pydantic-settings>=2.8,<3",
  "soundfile>=0.13,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6.16,<7",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
mcp = [
  "mcp>=2,<3",
]

[project.scripts]
beatweave-mcp = "beatweave.mcp.server:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatweave"]
