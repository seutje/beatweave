[package]
name = "beatweave"
version = "0.3.7"
description = "Beatweave local-first generative music video workstation"
authors = ["Beatweave contributors"]
edition = "2021"

[lib]
name = "beatweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
